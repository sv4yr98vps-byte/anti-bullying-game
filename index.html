<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>校園守護者</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: full-screen first-person canvas; chalkboard-green UI panels float over it as HUD, dialogue strip, decision cards. */
:root{
  --board:#1d3a33;
  --board-deep:#122621;
  --chalk:#f1f0e6;
  --chalk-dim:#b9c4bb;
  --yellow:#f2cf4a;
  --good:#7fd6a0;
  --warn:#f0a35a;
  --bad:#ef7b7b;
  --line:rgba(241,240,230,.22);
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--board-deep);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;box-sizing:border-box;position:relative;-webkit-user-select:none;user-select:none;touch-action:none}
#stage{position:fixed;inset:0;background:var(--board-deep)}
canvas{display:block;width:100%;height:100%}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5;flex-wrap:wrap}
.hud .title{font-family:var(--display);font-weight:700;font-size:1.05rem;background:rgba(18,38,33,.82);padding:6px 12px;border:1px solid var(--line)}
.hud .title small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--chalk-dim);letter-spacing:.06em}
.dots{display:flex;gap:6px;background:rgba(18,38,33,.82);padding:8px 10px;border:1px solid var(--line)}
.dot{width:14px;height:14px;border:2px solid var(--chalk-dim);border-radius:50%;box-sizing:border-box}
.dot.now{border-color:var(--yellow);background:rgba(242,207,74,.35)}
.dot.done{background:var(--good);border-color:var(--good)}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:5;
  background:rgba(18,38,33,.88);border:1px solid var(--yellow);color:var(--chalk);padding:6px 14px;font-size:.92rem;pointer-events:none;text-align:center;max-width:90vw}
.objective{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(74px + env(safe-area-inset-top,0px));z-index:5;max-width:min(360px,calc(100vw - 32px));
  background:rgba(18,38,33,.82);border-left:4px solid var(--yellow);padding:8px 12px;font-size:.9rem;pointer-events:none}
.dialog{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));width:min(760px,calc(100vw - 32px));z-index:6;
  background:var(--board);border:2px solid var(--chalk-dim);box-shadow:0 0 0 4px var(--board-deep);padding:12px 16px 12px;min-height:84px;box-sizing:border-box}
.dialog .who{font-family:var(--display);font-weight:700;color:var(--yellow);font-size:.95rem;letter-spacing:.04em}
.dialog .say{margin:2px 0 8px;font-size:1.02rem}
.dialog .next{display:block;margin-left:auto;background:none;border:1px solid var(--chalk-dim);color:var(--chalk);padding:6px 16px;font-size:.92rem}
.dialog .next:hover{border-color:var(--yellow);color:var(--yellow)}
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,22,19,.82);
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow-y:auto;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.panel{width:min(820px,100%);max-height:100%;overflow-y:auto;background:var(--board);border:2px solid var(--chalk-dim);box-shadow:0 0 0 5px var(--board-deep);padding:22px clamp(16px,4vw,32px);box-sizing:border-box}
.panel h1{font-family:var(--display);font-weight:900;font-size:clamp(1.9rem,6vw,2.8rem);margin:0 0 4px;letter-spacing:.04em;text-wrap:balance}
.panel h2{font-family:var(--display);font-weight:700;font-size:clamp(1.25rem,3.6vw,1.6rem);margin:0 0 6px;text-wrap:balance}
.kicker{color:var(--yellow);font-size:.82rem;letter-spacing:.14em;margin:0 0 8px}
.panel p{margin:8px 0}
.muted{color:var(--chalk-dim)}
.btn{background:var(--yellow);color:#1b2a22;border:0;padding:11px 22px;font-weight:700;font-size:1rem;letter-spacing:.04em}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--chalk);border:1px solid var(--chalk-dim)}
.btn.ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:14px 0}
.types span{border:1px dashed var(--chalk-dim);padding:6px 8px;text-align:center;font-size:.9rem}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;text-align:left;background:var(--board-deep);color:var(--chalk);border:1px solid var(--line);padding:12px 14px;font-size:1rem;line-height:1.5}
.opt:hover{border-color:var(--yellow)}
.opt .k{font-family:var(--display);font-weight:900;color:var(--yellow);font-size:1.15rem}
.opt.tried{opacity:.55}
.badge{display:inline-block;padding:2px 10px;font-weight:700;font-size:.85rem;border:1px solid currentColor;margin-bottom:6px}
.b-best{color:var(--good)}.b-ok{color:var(--yellow)}.b-risk{color:var(--warn)}.b-bad{color:var(--bad)}
.timeline{display:grid;gap:8px;margin:12px 0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:5.5em 1fr;gap:10px;border-top:1px solid var(--line);padding-top:8px}
.timeline b{color:var(--yellow);font-weight:500;font-size:.9rem}
.why{border-left:4px solid var(--chalk-dim);padding:6px 12px;margin:12px 0;background:var(--board-deep)}
.tip{border:1px solid var(--yellow);padding:8px 12px;margin:12px 0;font-size:.95rem}
.meter{display:flex;gap:6px;margin:8px 0}
.meter i{flex:1;height:10px;background:var(--board-deep);border:1px solid var(--line)}
.meter i.on{background:var(--good)}
.sum{width:100%;border-collapse:collapse;font-size:.95rem}
.sum td,.sum th{border-top:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.sum th{color:var(--chalk-dim);font-weight:500;font-size:.82rem}
.sumwrap{overflow-x:auto}
.joy{position:fixed;left:max(22px,env(safe-area-inset-left,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;
  border:2px solid var(--chalk-dim);background:rgba(18,38,33,.55);z-index:7;display:none;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(241,240,230,.55)}
.act{position:fixed;right:max(22px,env(safe-area-inset-right,0px));bottom:calc(130px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;
  background:var(--yellow);color:#1b2a22;border:0;font-weight:700;z-index:7;display:none}
body.touch .joy,body.touch .act{display:block}
body.touch .hint{bottom:calc(240px + env(safe-area-inset-bottom,0px))}
.guide{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(74px + env(safe-area-inset-top,0px));z-index:5;font-size:.78rem;color:var(--chalk-dim);
  background:rgba(18,38,33,.7);padding:6px 10px;border:1px solid var(--line);pointer-events:none}
body.touch .guide{display:none}
@media (max-width:560px){.guide{display:none}.objective{top:calc(112px + env(safe-area-inset-top,0px))}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>


<div id="stage"></div>

<div class="hud" id="hud" hidden>
  <div class="title"><span id="sceneName"></span><small id="sceneType"></small></div>
  <div class="dots" id="dots" aria-label="進度"></div>
</div>
<div class="objective" id="objective" hidden></div>
<div class="guide" id="guide" hidden>拖曳畫面轉頭 ・ WASD／方向鍵移動 ・ E 互動</div>
<div class="hint" id="hint" hidden></div>
<div class="dialog" id="dialog" hidden>
  <div class="who" id="dWho"></div>
  <div class="say" id="dSay"></div>
  <button class="next" id="dNext">繼續</button>
</div>
<div class="joy" id="joy"><i id="joyK"></i></div>
<button class="act" id="act" hidden>互動</button>

<div class="overlay" id="start">
  <div class="panel">
    <p class="kicker">反霸凌情境演練 ・ 第一人稱</p>
    <h1>校園守護者</h1>
    <p>你是這所學校的學生。走進六個校園場景，親眼看見霸凌發生，然後決定你要怎麼做。每個選擇都會帶來不同的後果，包括一週後、一個月後的變化。</p>
    <div class="types"><span>肢體霸凌</span><span>言語霸凌</span><span>關係霸凌</span><span>網路霸凌</span><span>性霸凌</span><span>反擊型霸凌</span></div>
    <p class="muted">操作：電腦用滑鼠拖曳轉頭，WASD 或方向鍵移動，靠近同學按 E。手機用左下搖桿移動，拖曳畫面轉頭，點右下「互動」。</p>
    <p class="muted">情境為教學模擬，人物與事件皆為虛構。內容包含同學被欺負的場面，若覺得不舒服可以隨時停下來告訴老師。</p>
    <div class="row"><button class="btn" id="goBtn">進入校園</button></div>
  </div>
</div>
<div class="overlay" id="decide" hidden><div class="panel" id="decidePanel"></div></div>
<div class="overlay" id="result" hidden><div class="panel" id="resultPanel"></div></div>
<div class="overlay" id="finale" hidden><div class="panel" id="finalePanel"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---- 情境資料 (r: best / ok / risk / bad ; after: v=受害者 up/same/down, b=欺負者 stop/stay/angry, c=旁觀同學 help/laugh/none)
const RATE={best:{n:'最佳處置',s:3,c:'b-best'},ok:{n:'有幫助，但不夠完整',s:2,c:'b-ok'},risk:{n:'有風險',s:1,c:'b-risk'},bad:{n:'讓情況更糟',s:0,c:'b-bad'}};
const SC=[
{id:1,name:'三樓走廊',type:'肢體霸凌',place:'hall',tint:0xf3e2b8,
 objective:'下課了。走廊前面好像有人在吵，走過去看看。',
 npcs:[{k:'v',n:'小宇',x:-0.6,z:-2.7,c:0x5b8def},{k:'b',n:'阿杰',x:0.9,z:-2.1,c:0xd9534f},{k:'f',n:'小凱',x:2.1,z:-3.2,c:0xe0a030},{k:'w',n:'小琪',x:-3.6,z:-0.6,c:0x8e6fc9}],
 incident:[['旁白','阿杰一把將小宇推到置物櫃上，砰的一聲。小宇的筆袋被扔到地上。'],['阿杰','走路不會看路喔？撿起來啊，撿啊。'],['小凱','哈哈，他又要哭了。'],['旁白','小宇低著頭不說話，手在發抖。旁邊的小琪看了一眼，轉身走開。']],
 options:[
 {t:'衝上去把阿杰推開，對他大吼：「你再碰他試試看！」',r:'risk',after:{v:'same',b:'angry',c:'none'},
  lines:[['阿杰','你誰啊？想打架是不是？'],['旁白','兩個人扭成一團，走廊瞬間擠滿圍觀的同學。巡堂老師趕到時，只看到你和阿杰在互推。']],
  tl:['當下','你和阿杰都被帶到學務處，小宇被擠到一旁，沒有人問他發生了什麼事。','一週後','阿杰對你懷恨在心，改在放學後堵你。小宇更不敢開口。','一個月後','事情從「欺負小宇」變成「你和阿杰互相結怨」，原本的問題反而沒有被處理。'],
  why:'出於正義感很可貴，但用肢體對抗容易讓自己受傷，也可能被視為互毆，真正被欺負的人反而被忽略。'},
 {t:'大聲說「住手，我去叫老師！」，立刻跑去辦公室。回來後陪小宇撿起筆袋。',r:'best',after:{v:'up',b:'stop',c:'help'},
  lines:[['阿杰','…幹嘛啦，開玩笑而已。'],['旁白','阿杰他們退了一步。你找來導師時，小宇還站在原地。導師先把小宇帶到安靜的地方，再請阿杰和小凱到學務處。'],['小宇','謝謝你…我一直不知道該怎麼說。']],
  tl:['當下','衝突立刻中止，沒有人受傷。小宇被老師關心，也有人聽他說出整件事。','一週後','學校啟動霸凌處理程序，通知雙方家長，輔導室開始定期關心小宇。','一個月後','阿杰在輔導與規範下改變行為，小宇敢在走廊正常走路，也多了一個願意陪他的朋友：你。'],
  why:'你沒有用暴力，也沒有走開。出聲制止加上找大人，既保護了自己，也讓學校能正式處理。這是旁觀者最安全有效的做法。'},
 {t:'走過去帶小宇離開現場，但事後覺得他沒受傷，就不用告訴老師。',r:'ok',after:{v:'same',b:'stay',c:'none'},
  lines:[['小宇','謝謝你帶我走…可是不要跟老師說，會被報復。'],['旁白','你點點頭。阿杰看著你們離開，什麼也沒說。']],
  tl:['當下','小宇暫時脫身，心裡鬆了一口氣。','一週後','阿杰沒被任何人制止，又推了小宇兩次，這次在沒人的樓梯間。','一個月後','小宇開始假裝肚子痛、不想來學校。因為沒人通報，老師完全不知道。'],
  why:'陪伴很重要，但沒有通報，欺負的人沒有被處理，同樣的事很容易再發生。通報不是告狀，是讓大人有機會保護你們。'},
 {t:'假裝沒看到，快步走過去。不關我的事。',r:'bad',after:{v:'down',b:'stay',c:'laugh'},
  lines:[['旁白','你低著頭走過，背後傳來阿杰的笑聲。'],['旁白','小宇抬頭，剛好看到你的背影。']],
  tl:['當下','阿杰看到沒人阻止，更確定自己可以這樣做。','一週後','推擠變成每天固定的事，旁邊越來越多人只是看。','一個月後','小宇覺得整個班級都不在乎他。你也常想起那天的畫面，心裡不舒服。'],
  why:'旁觀者的沉默會被欺負的人解讀成默許，也讓被欺負的人更孤單。你不一定要正面衝突，但至少可以去找大人。'}
 ],
 tip:'遇到肢體衝突，先確保自己的安全，用最快的方式找老師或教官來處理。'},

{id:2,name:'二年三班教室',type:'言語霸凌',place:'class',tint:0xe9f0d0,
 objective:'午休前，教室後面有一群人聚在一起，靠近聽聽看。',
 npcs:[{k:'v',n:'小芸',x:-0.2,z:-3.2,c:0xe86f9b},{k:'b',n:'小玲',x:-1.6,z:-2.2,c:0x4aa3a2},{k:'f',n:'小婷',x:1.2,z:-2.2,c:0xcf8a3a},{k:'w',n:'阿哲',x:3.4,z:-0.2,c:0x6f8fb8}],
 incident:[['小玲','欸，你的口音好好笑喔，再說一次「這個」。'],['小婷','哈哈哈，你講話像外星人。'],['小玲','你根本沒有朋友吧？每次都自己一個。胖妹。'],['旁白','小芸把臉埋在書裡，肩膀輕輕發抖。全班有一半的人都聽到了，沒有人抬頭。']],
 options:[
 {t:'跟著笑一下，因為不想成為下一個被嘲笑的人。',r:'bad',after:{v:'down',b:'stay',c:'laugh'},
  lines:[['小玲','你看，連他也覺得好笑。'],['旁白','小芸慢慢抬頭，看到你在笑。她的眼眶紅了。']],
  tl:['當下','小玲被笑聲鼓勵，嘲笑變本加厲。','一週後','「外星人」變成小芸的班級外號，連別班的人都開始叫。','一個月後','小芸不再舉手發言，成績和心情一起下滑。你也成了這件事的一部分，這會留在你的心裡。'],
  why:'附和和笑聲，會讓欺負的人覺得被認同。即使你不是主導者，你的反應仍然是影響結果的一部分。'},
 {t:'走過去平靜地說：「這樣講話很傷人，不好笑。」然後問小芸要不要一起去洗手間。',r:'ok',after:{v:'up',b:'angry',c:'none'},
  lines:[['小玲','幹嘛，你很愛管耶。'],['旁白','小玲瞪了你一眼，但沒有再說話。小芸跟你走出教室，輕輕說了聲謝謝。']],
  tl:['當下','這一刻有人站出來，小芸感受到被支持。','一週後','小玲換成在背後講你們，行為並沒有真正停下來。','一個月後','如果沒有老師介入，小芸還是常被嘲笑，只是更隱蔽。'],
  why:'平靜表態很有力量，但言語霸凌通常是持續性的，單靠同學制止不一定能停下來，也需要老師和輔導室介入。'},
 {t:'當下先陪小芸離開，午休時私下問她的感受，再一起去找導師，說明你聽到的內容。',r:'best',after:{v:'up',b:'stop',c:'help'},
  lines:[['小芸','…我不知道可不可以說。'],['你','我有聽到，也記得她說了什麼。我陪你去。'],['導師','謝謝你們說出來。我會處理，也會讓輔導老師關心小芸。']],
  tl:['當下','小芸感覺被理解，不再覺得是自己有問題。','一週後','導師在班上宣導尊重，並個別處理小玲。小玲被要求道歉，也要接受輔導。','一個月後','班級氣氛改變，小芸開始有人邀她一起吃午餐，嘲笑外號慢慢消失。'],
  why:'你先照顧受害者的感受，再把事實說給可以處理的大人聽。有人證、說得具體，讓老師更容易公平處理。'},
 {t:'低頭滑手機，覺得這種嘴巴講講的事沒那麼嚴重。',r:'risk',after:{v:'down',b:'stay',c:'none'},
  lines:[['旁白','你把視線移開。教室的另一頭仍然傳來笑聲。']],
  tl:['當下','小芸沒有等到任何人的回應。','一週後','每天都有人拿她的口音和身材開玩笑，她開始少說話。','一個月後','言語傷害累積成自信的崩塌，小芸出現失眠，不太願意去學校。'],
  why:'言語霸凌看不到傷口，卻同樣會傷害人。不要因為「只是講話」就低估它。'}
 ],
 tip:'言語霸凌包括辱罵、嘲笑外貌、取外號等。記下時間、地點、說了什麼，是之後老師處理的重要依據。'},

(function(){
'use strict';
const $=id=>document.getElementById(id);
const stage=$('stage');
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}
catch(e){stage.innerHTML='<div style="padding:40px;color:#f1f0e6">這個瀏覽器無法顯示 3D 畫面，請改用較新版本的 Chrome、Safari 或 Edge。</div>';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,1,0.1,60);
camera.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xffffff,0x9a8f78,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.55);sun.position.set(4,8,6);scene.add(sun);
let world=new THREE.Group();scene.add(world);
let colliders=[];let npcs=[];
const mats={};
const mat=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
function resize(){
  const w=stage.clientWidth||window.innerWidth,h=stage.clientHeight||window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=(w/h<0.8)?82:70;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();

function box(w,h,d,c,x,y,z,col){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),(typeof c==='object')?c:mat(c));
  m.position.set(x,y,z);world.add(m);
  if(col)colliders.push({x1:x-w/2,x2:x+w/2,z1:z-d/2,z2:z+d/2});
  return m;
}
function tex(lines,w,h,bg,fg,size){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const g=cv.getContext('2d');
  if(bg){g.fillStyle=bg;g.fillRect(0,0,w,h);}
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';
  g.font='700 '+size+'px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  lines.forEach((t,i)=>g.fillText(t,w/2,h*(i+1)/(lines.length+1)));

// ================= 遊戲流程 =================
const hud=$('hud'),dotsEl=$('dots'),obj=$('objective'),hint=$('hint'),guide=$('guide'),dlg=$('dialog'),dWho=$('dWho'),dSay=$('dSay'),dNext=$('dNext'),joyEl=$('joy'),joyK=$('joyK');
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
let state='title',cur=0,order=[0,1,2,3],res=[],lineQ=[],lineDone=null,resultTimer=0;
const player={x:0,z:5.6,yaw:0,pitch:0};
const keys={};const joy={x:0,y:0};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

function blocked(x,z){
  if(Math.abs(x)>6.8||Math.abs(z)>6.8)return true;
  const r=0.35;
  for(const c of colliders)if(x>c.x1-r&&x<c.x2+r&&z>c.z1-r&&z<c.z2+r)return true;
  for(const n of npcs)if(Math.hypot(x-n.g.position.x,z-n.g.position.z)<0.62)return true;
  return false;
}
function tryMove(dx,dz){const nx=player.x+dx,nz=player.z+dz;if(!blocked(nx,nz)){player.x=nx;player.z=nz;}}
function move(dt){
  let f=0,s=0;
  if(keys.w||keys.arrowup)f+=1;
  if(keys.s||keys.arrowdown)f-=1;
  if(keys.d)s+=1;
  if(keys.a)s-=1;
  if(keys.arrowleft)player.yaw+=1.8*dt;
  if(keys.arrowright)player.yaw-=1.8*dt;
  f+=-joy.y;s+=joy.x;
  const len=Math.hypot(f,s);if(len>1){f/=len;s/=len;}
  const sp=3.2*dt;
  tryMove((-Math.sin(player.yaw)*f+Math.cos(player.yaw)*s)*sp,0);
  tryMove(0,(-Math.cos(player.yaw)*f-Math.sin(player.yaw)*s)*sp);
  return len>0.05;
}

// ---- 人物動作
function applyAfter(a){
  const v=npcs.find(n=>n.d.k==='v');
  npcs.forEach(n=>{
    const k=n.d.k;
    if(k==='v')n.st='v_'+a.v;
    else if(k==='b'){n.st='b_'+a.b;if(a.b==='stop'){n.tx=n.bx+1.2;n.tz=n.bz-1.4;}}
    else{
      n.st='c_'+a.c;
      if(a.c==='help'&&k==='w'){n.tx=v.bx+0.95;n.tz=v.bz+0.9;}
      if(a.c==='help'&&k==='f'){n.tx=n.bx+1;n.tz=n.bz-1;}
    }
  });
}
function resetNPCs(){npcs.forEach(n=>{n.st='inc';n.tx=n.bx;n.tz=n.bz;n.g.position.set(n.bx,0,n.bz);n.g.scale.y=1;});}
const ease=(a,b,k)=>a+(b-a)*Math.min(1,k);
function animNPCs(dt,t){
  for(const n of npcs){
    const k=n.d.k,st=n.st||'inc',g=n.g;
    const mx=n.tx-g.position.x,mz=n.tz-g.position.z;
    g.position.x+=mx*Math.min(1,dt*2.2);g.position.z+=mz*Math.min(1,dt*2.2);
    if(n.face){
      const a=Math.atan2(n.face.g.position.x-g.position.x,n.face.g.position.z-g.position.z);
      let da=a-g.rotation.y;da=Math.atan2(Math.sin(da),Math.cos(da));g.rotation.y+=da*Math.min(1,dt*6);
    }
    let headX=0.1,aR=0,aL=0,bob=0,sx=0,scY=1;
    if(st==='inc'){
      if(k==='v'){headX=0.55;aL=0.15;}
      if(k==='b'){aR=-1.0+Math.sin(t*5+n.ph)*0.6;headX=-0.1;}
      if(k==='f'){bob=Math.abs(Math.sin(t*7+n.ph))*0.05;}
      if(k==='w'){headX=0.25;}
    }else if(st==='v_up'){headX=-0.05;}
    else if(st==='v_same'){headX=0.4;aL=0.12;}
    else if(st==='v_down'){headX=0.85;scY=0.95;}
    else if(st==='b_stop'){headX=0.35;}
    else if(st==='b_stay'){aR=-0.5+Math.sin(t*3+n.ph)*0.25;}
    else if(st==='b_angry'){aR=-1.3+Math.sin(t*9)*0.3;sx=Math.sin(t*30)*0.02;}
    else if(st==='c_help'){headX=0;}
    else if(st==='c_laugh'){bob=Math.abs(Math.sin(t*8+n.ph))*0.06;}
    else if(st==='c_none'){headX=0.25;}
    n.head.rotation.x=ease(n.head.rotation.x,headX,dt*5);
    n.armR.rotation.x=ease(n.armR.rotation.x,aR,dt*6);
    n.armL.rotation.x=ease(n.armL.rotation.x,aL,dt*6);
    g.scale.y=ease(g.scale.y,scY,dt*4);
    g.position.y=bob;
    const walking=Math.hypot(mx,mz)>0.06;
    n.legL.rotation.x=walking?Math.sin(t*10)*0.5:0;
    n.legR.rotation.x=walking?-Math.sin(t*10)*0.5:0;
    g.position.x+=sx;
  }
}

function nextLine(){

}

  clearTimeout(resultTimer);
  ['result','decide','finale'].forEach(id=>$(id).hidden=true);
  dlg.hidden=true;hud.hidden=true;guide.hidden=true;hint.hidden=true;obj.hidden=true;joyEl.hidden=true;
  buildScene(SC[0]);state='title';$('start').hidden=false;
}

// ---- 首頁
const typesEl=$('start').querySelector('.types');
typesEl.innerHTML=SC.map((s,i)=>'<button class="btn ghost" style="padding:8px 6px;font-size:.9rem" data-i="'+i+'">'+s.type+'</button>').join('');
typesEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{res=[];startScene(+b.dataset.i);}));
$('goBtn').addEventListener('click',()=>{res=[];startScene(0);});

// ---- 輸入
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)&&state!=='title')e.preventDefault();
  if(k==='e'||k==='enter'||k===' '){if(!dlg.hidden){nextLine();return;}}
  keys[k]=true;
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.x=joy.y=0;});
let drag=null;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{
  if(!drag||drag.id!==e.pointerId)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;
  if(state==='explore'){player.yaw-=dx*0.005;player.pitch=Math.max(-1,Math.min(1,player.pitch-dy*0.004));}
});
const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
let jid=null;
function joyMove(e){
  const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),max=r.width/2-8;
  if(m>max){dx*=max/m;dy*=max/m;}
  joy.x=dx/max;joy.y=dy/max;joyK.style.transform='translate('+dx+'px,'+dy+'px)';
}
joyEl.addEventListener('pointerdown',e=>{jid=e.pointerId;try{joyEl.setPointerCapture(e.pointerId);}catch(_){}joyMove(e);e.preventDefault();});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===jid)joyMove(e);});
const joyEnd=e=>{if(e.pointerId===jid){jid=null;joy.x=joy.y=0;joyK.style.transform='';}};
joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
joyEl.hidden=true;

// ---- 主迴圈
let last=performance.now();
function lookAtCenter(dt){
  const dx=0-player.x,dz=-2.4-player.z;
  const a=Math.atan2(-dx,-dz);
  let da=a-player.yaw;da=Math.atan2(Math.sin(da),Math.cos(da));
  player.yaw+=da*Math.min(1,dt*3);player.pitch=ease(player.pitch,0,dt*3);
}
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;const t=now/1000;
  let bobY=0;
  if(state==='explore'){
    const moving=move(dt);
    if(moving)bobY=Math.sin(t*9)*0.03;
    if(Math.hypot(player.x,player.z+2.4)<5.0)trigger();
  }else if(state==='title'){
    player.x=0;player.z=5.6;player.yaw=Math.sin(t*0.25)*0.35;player.pitch=0;
  }else{lookAtCenter(dt);}
  animNPCs(dt,t);
  camera.position.set(player.x,1.55+bobY,player.z);
  camera.rotation.set(player.pitch,player.yaw,0);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
buildScene(SC[0]);
requestAnimationFrame(loop);
})();
</script>

</body>
